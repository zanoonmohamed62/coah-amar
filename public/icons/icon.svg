<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Deep Luxury Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Radiant Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Vibrant Electric Athletic Gradient (NOT FADED - HIGH SATURATION) -->
    <linearGradient id="xGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="20%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Razor Chrome Specular Edge Highlight -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>

    <!-- High-Contrast Inner Facet Bevel -->
    <linearGradient id="facetGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#1e40af" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Neon Energy Glow Filter -->
    <filter id="neonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Crisp Depth Shadow Filter -->
    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base background (full bleed for maskable safe display) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Atmospheric Core Radial Glow -->
  <rect width="512" height="512" fill="url(#ambientGlow)"/>

  <!-- Subtle luxury tech chassis squircle (inside safe area) -->
  <rect x="24" y="24" width="464" height="464" rx="105" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15"/>
  <rect x="32" y="32" width="448" height="448" rx="98" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>

  <!-- Centered Athletic Geometric Grid Guides (very subtle) -->
  <g opacity="0.05" stroke="#ffffff">
    <circle cx="256" cy="256" r="170" fill="none" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke-width="1"/>
  </g>

  <!-- ══════════════════════════════════════════════════
       THE VIBRANT ATHLETIC "X" — HEROIC, CRISP & CENTERED
       ══════════════════════════════════════════════════ -->
  <g id="heroic-x">
    <!-- 1. Neon Aura Underlayer -->
    <path
      d="M110 110 L220 256 L110 402 H192 L256 308 L320 402 H402 L292 256 L402 110 H320 L256 204 L192 110 Z"
      fill="#0284c7"
      filter="url(#neonBloom)"
      opacity="0.75"
    />

    <!-- 2. Main Athletic Body with Crisp 3D Shadow -->
    <g filter="url(#crispShadow)">
      <!-- Solid Vivid Electric Body -->
      <path
        d="M115 115 L224 256 L115 397 H194 L256 305 L318 397 H397 L288 256 L397 115 H318 L256 207 L194 115 Z"
        fill="url(#xGradPrimary)"
      />

      <!-- Sharp 3D Beveled Inner Facet -->
      <path
        d="M142 132 L238 256 L142 380 H174 L256 274 L338 380 H370 L274 256 L370 132 H338 L256 238 L174 132 Z"
        fill="url(#facetGrad)"
      />

    <!-- Specular High-Gloss Razor Bevel (Upper Diagonal Edges - split into two strokes) -->
      <path
        d="M115 115 L194 115 L256 207"
        fill="none"
        stroke="url(#specularGrad)"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M397 115 L318 115 L256 207"
        fill="none"
        stroke="url(#specularGrad)"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Specular Lower Diagonal Accents -->
      <path
        d="M115 397 L194 397 L256 305"
        fill="none"
        stroke="#38bdf8"
        stroke-width="3"
        stroke-opacity="0.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M397 397 L318 397 L256 305"
        fill="none"
        stroke="#38bdf8"
        stroke-width="3"
        stroke-opacity="0.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Center Power Convergence Diamond -->
      <polygon
        points="256,226 286,256 256,286 226,256"
        fill="#ffffff"
        opacity="0.85"
      />
      <polygon
        points="256,236 276,256 256,276 236,256"
        fill="#0284c7"
      />
      <circle cx="256" cy="256" r="4.5" fill="#ffffff"/>
    </g>
  </g>
</svg>