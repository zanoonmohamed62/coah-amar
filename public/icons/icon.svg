<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Deep Luxury Matte Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#06080f" />
      <stop offset="100%" stop-color="#04050a" />
    </linearGradient>

    <!-- Metallic Cobalt Steel (Primary Wing) -->
    <linearGradient id="steelPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="15%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Deep Titanium Cobalt (Secondary Wing) -->
    <linearGradient id="steelSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Chrome Edge Highlight -->
    <linearGradient id="chromeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Precision Bevel Frame -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Solid Chassis Container with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Precision Inset Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#frameGrad)" stroke-width="3" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />

  <!-- Subtly Textured Architectural Grid -->
  <g opacity="0.04">
    <line x1="256" y1="40" x2="256" y2="472" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6" />
    <line x1="40" y1="256" x2="472" y2="256" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- ══════════════════════════════════════════════════
       THE "A-X" LUXURY ATHLETIC MONOGRAM EMBLEM
       Intersecting dynamic kinetic blades with 45° chamfers
       ══════════════════════════════════════════════════ -->
  <g id="monogram" transform="translate(0, 0)">
    <!-- Shadow projection behind the emblem for realistic mechanical depth -->
    <path
      d="M136 128 L232 256 L136 384 H188 L256 292 L324 384 H376 L280 256 L376 128 H324 L256 220 L188 128 Z"
      fill="#000000"
      opacity="0.6"
      transform="translate(0, 8)"
    />

    <!-- Backward Blade (Left-Bottom to Top-Right) with Dark Cobalt Steel Facet -->
    <path
      d="M376 128 L188 384 H136 L324 128 Z"
      fill="url(#steelSecondary)"
    />

    <!-- Forward Blade (Top-Left to Bottom-Right) with Brilliant Light Chrome Facet -->
    <path
      d="M136 128 L324 384 H376 L188 128 Z"
      fill="url(#steelPrimary)"
    />

    <!-- Central Precision Cut: The Intersecting Diamond Core -->
    <polygon
      points="256,206 294,256 256,306 218,256"
      fill="#080c16"
      stroke="#38bdf8"
      stroke-width="3"
    />

    <!-- Apex Inner Chevron (Evoking the "A" in Amar) -->
    <polygon
      points="256,156 288,200 224,200"
      fill="url(#steelPrimary)"
    />

    <!-- Razor Edge Highlights: Pure Chrome Reflections along upper bevels -->
    <path
      d="M136 128 L324 384"
      stroke="url(#chromeHighlight)"
      stroke-width="5"
      stroke-linecap="round"
    />
    <path
      d="M188 128 L376 384"
      stroke="#ffffff"
      stroke-width="1.5"
      stroke-opacity="0.3"
      stroke-linecap="round"
    />

    <!-- Dynamic Athletic Accent Wings (Chamfered Fins) -->
    <polygon
      points="108,242 142,256 108,270"
      fill="#38bdf8"
      opacity="0.85"
    />
    <polygon
      points="404,242 370,256 404,270"
      fill="#38bdf8"
      opacity="0.85"
    />
  </g>

  <!-- Discrete Luxury Athletic Wordmark: "X-SPLIT" -->
  <text
    x="256"
    y="438"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="34"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="10"
    opacity="0.9"
  >AMAR X</text>
</svg>