<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Group to shift A up -->
  <g transform="translate(0, -40)">
    <!-- Subtle glow behind the A -->
    <g filter="url(#neonGlow)" opacity="0.6">
      <path d="M 256 120 L 370 380 H 290 L 270 310 H 242 L 222 380 H 142 Z M 256 230 L 280 290 H 232 Z" fill="url(#glowGrad)"/>
    </g>

    <!-- Main Athletic Bold "A" -->
    <path d="M 256 120 L 370 380 H 290 L 270 310 H 242 L 222 380 H 142 Z M 256 230 L 280 290 H 232 Z" fill="url(#blueGrad)"/>

    <!-- Sharp Inner Accent Highlight -->
    <path d="M 256 140 L 340 360 H 310 L 290 310 H 222 L 202 360 H 172 Z M 256 250 L 270 290 H 242 Z" fill="#93c5fd" opacity="0.4"/>
  </g>

  <!-- SPLIT Text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="68" fill="#ffffff" text-anchor="middle" letter-spacing="12">SPLIT</text>
</svg>