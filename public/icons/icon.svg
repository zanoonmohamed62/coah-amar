<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle glow behind the X -->
  <g filter="url(#neonGlow)" opacity="0.6">
    <path d="M120 120 L220 256 L120 392 H190 L256 300 L322 392 H392 L292 256 L392 120 H322 L256 212 L190 120 Z" fill="url(#glowGrad)"/>
  </g>

  <!-- Main Athletic Bold "X" -->
  <path d="M125 125 L225 256 L125 387 H195 L256 298 L317 387 H387 L287 256 L387 125 H317 L256 214 L195 125 Z" fill="url(#blueGrad)"/>

  <!-- Sharp Inner Accent Highlight -->
  <path d="M150 140 L240 256 L150 372 H175 L256 268 L337 372 H362 L272 256 L362 140 H337 L256 244 L175 140 Z" fill="#93c5fd" opacity="0.4"/>
</svg>