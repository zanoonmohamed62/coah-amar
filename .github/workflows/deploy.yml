name: Deploy to OVH VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting Deployment..."

            # Go to app directory
            cd /var/www/amarel7ewety

            # Pull latest changes from GitHub
            echo "📥 Pulling latest changes..."
            git reset --hard HEAD
            git pull origin main

            # Persistent storage — public/uploads and private_media are runtime-written
            # (Site Editor image uploads, protected media library) and are NOT tracked in
            # git. `git reset --hard`/`git pull` only touch tracked files, so these paths
            # survive deploys as long as they stay untracked and don't get otherwise wiped.
            # Kept as a hidden, untracked, gitignored subfolder of the app directory itself
            # (not a sibling of /var/www/amarel7ewety) since the deploy user only owns this
            # directory, not its parent. This block is idempotent — once the symlink exists,
            # every future deploy just no-ops here.
            echo "🗂️  Ensuring persistent upload storage..."
            PERSIST_DIR="/var/www/amarel7ewety/.persist"
            mkdir -p "$PERSIST_DIR/uploads" "$PERSIST_DIR/private_media"
            for pair in "public/uploads:$PERSIST_DIR/uploads" "private_media:$PERSIST_DIR/private_media"; do
              LOCAL_PATH="${pair%%:*}"
              PERSIST_PATH="${pair##*:}"
              if [ -L "$LOCAL_PATH" ]; then
                echo "  ✓ $LOCAL_PATH already linked to persistent storage"
              elif [ -d "$LOCAL_PATH" ]; then
                echo "  → migrating existing $LOCAL_PATH into persistent storage"
                cp -rn "$LOCAL_PATH"/. "$PERSIST_PATH"/ 2>/dev/null || true
                rm -rf "$LOCAL_PATH"
                ln -s "$PERSIST_PATH" "$LOCAL_PATH"
              else
                ln -s "$PERSIST_PATH" "$LOCAL_PATH"
              fi
            done

            # Install dependencies
            echo "📦 Installing dependencies..."
            npm install --no-audit --no-fund

            # Prisma generate & DB push
            if [ -f "prisma/schema.prisma" ]; then
              echo "🗄️ Running Prisma generate..."
              npx prisma generate

              # Bring columns that `db push` cannot add on its own to their target
              # state first — notably a UNIQUE NOT NULL column on a table that
              # already has rows, which is what failed every deploy from
              # 2026-09-05 onward. Idempotent; a no-op once applied.
              echo "🗄️ Running pre-push migration guard..."
              node scripts/pre-push-migrate.js

              # No --accept-data-loss: that flag lets a schema edit silently drop
              # real customer data with no confirmation. If a future change
              # genuinely needs to discard a column, do it deliberately in
              # scripts/pre-push-migrate.js (or a real migration) rather than
              # granting blanket permission on every deploy.
              echo "🗄️ Pushing DB schema..."
              npx prisma db push

              # Checkout is dead without at least one active product: /api/products
              # returns [], neither checkout page can resolve a productId, and the
              # customer is stuck on "Product not loaded. Please refresh the page."
              # This only creates a product whose slug is missing, and never
              # overwrites prices on an existing row — those belong to the admin.
              echo "🛒 Verifying sellable products exist..."
              node scripts/ensure-products.js
            fi

            # Build application
            echo "⚙️ Building application..."
            npm run build

            # Reload PM2 process zero-downtime
            echo "🔄 Reloading PM2..."
            pm2 reload amar-site --update-env || pm2 start npm --name "amar-site" -- start

            # Twice-daily training reminder job (see ecosystem.config.js). Started
            # from the ecosystem file so its cron schedule is registered; on later
            # deploys this just refreshes it. Never allowed to fail the deploy —
            # a missing reminder is not a reason to leave the site half-updated.
            echo "⏰ Registering training reminder job..."
            pm2 startOrReload ecosystem.config.js --only amar-reminders --update-env || true
            pm2 save || true

            # Health check — a reload that leaves the app crash-looping would
            # otherwise report success while the site is down. Poll the local
            # port until it answers, and fail the deploy if it never does.
            echo "🩺 Waiting for the app to answer..."
            HEALTH_OK=0
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/ || true)
              if [ "$CODE" = "200" ] || [ "$CODE" = "307" ] || [ "$CODE" = "308" ]; then
                HEALTH_OK=1
                echo "  ✓ app responded with HTTP $CODE after ${i} attempt(s)"
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" != "1" ]; then
              echo "❌ App did not become healthy after reload. Recent logs:"
              pm2 logs amar-site --lines 40 --nostream || true
              exit 1
            fi

            echo "✅ Deployment completed successfully!"
