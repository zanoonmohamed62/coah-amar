name: Deploy to OVH VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting Deployment..."

            # Go to app directory
            cd /var/www/amarel7ewety

            # Pull latest changes from GitHub
            echo "📥 Pulling latest changes..."
            git reset --hard HEAD
            git pull origin main

            # Persistent storage — public/uploads and private_media are runtime-written
            # (Site Editor image uploads, protected media library) and are NOT tracked in
            # git. `git reset --hard`/`git pull` only touch tracked files, so these paths
            # survive deploys as long as they stay untracked and don't get otherwise wiped.
            # Kept as a hidden, untracked, gitignored subfolder of the app directory itself
            # (not a sibling of /var/www/amarel7ewety) since the deploy user only owns this
            # directory, not its parent. This block is idempotent — once the symlink exists,
            # every future deploy just no-ops here.
            echo "🗂️  Ensuring persistent upload storage..."
            PERSIST_DIR="/var/www/amarel7ewety/.persist"
            mkdir -p "$PERSIST_DIR/uploads" "$PERSIST_DIR/private_media"
            for pair in "public/uploads:$PERSIST_DIR/uploads" "private_media:$PERSIST_DIR/private_media"; do
              LOCAL_PATH="${pair%%:*}"
              PERSIST_PATH="${pair##*:}"
              if [ -L "$LOCAL_PATH" ]; then
                echo "  ✓ $LOCAL_PATH already linked to persistent storage"
              elif [ -d "$LOCAL_PATH" ]; then
                echo "  → migrating existing $LOCAL_PATH into persistent storage"
                cp -rn "$LOCAL_PATH"/. "$PERSIST_PATH"/ 2>/dev/null || true
                rm -rf "$LOCAL_PATH"
                ln -s "$PERSIST_PATH" "$LOCAL_PATH"
              else
                ln -s "$PERSIST_PATH" "$LOCAL_PATH"
              fi
            done

            # Install dependencies
            echo "📦 Installing dependencies..."
            npm install --no-audit --no-fund

            # Prisma generate & DB push
            if [ -f "prisma/schema.prisma" ]; then
              echo "🗄️ Running Prisma generate..."
              npx prisma generate
              echo "🗄️ Pushing DB schema..."
              npx prisma db push --accept-data-loss
            fi

            # Build application
            echo "⚙️ Building application..."
            npm run build

            # Reload PM2 process zero-downtime
            echo "🔄 Reloading PM2..."
            pm2 reload amar-site --update-env || pm2 start npm --name "amar-site" -- start

            echo "✅ Deployment completed successfully!"
