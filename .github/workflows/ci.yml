name: CI

# Runs on every push and pull request, including pushes to main *before* the
# deploy workflow reaches the VPS. The point is to catch a broken commit here,
# on a throwaway runner, instead of discovering it after `set -e` has already
# aborted a production deploy halfway through.
#
# Deliberately does NOT touch the VPS or the production database.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer commit supersedes an in-flight check for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, lint and build
    runs-on: ubuntu-latest

    services:
      # A real Postgres so `prisma db push` and the pre-push migration guard are
      # exercised against an actual database rather than mocked. This is the
      # check that would have caught the accessToken failure: adding a UNIQUE
      # NOT NULL column to a table with existing rows.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Auth refuses to start without a secret in production; any value works
      # for a build that never serves a real session.
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production
      AUTH_SECRET: ci-placeholder-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm install`, not `npm ci`. The lockfile is generated on Windows, where
      # npm never resolves the wasm32 optional dependencies of
      # @tailwindcss/oxide-wasm32-wasi and @unrs/resolver-binding-wasm32-wasi —
      # so their @emnapi/core and @emnapi/runtime entries are absent, and `npm
      # ci` on Linux rejects the whole lockfile as out of sync. Regenerating the
      # lockfile does not fix it (npm on Windows produces the same gap) and
      # rewriting it on Linux would churn ~1,300 lines and drift every time it is
      # next touched from Windows.
      #
      # `npm install` resolves those platform packages on the runner instead of
      # failing. The tradeoff is that CI is no longer byte-locked to the
      # lockfile; the deploy uses `npm install` on the VPS too, so this matches
      # what production actually installs.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to a clean database
        run: npx prisma db push

      # Seed a row *before* re-running the migration path, so the guard is
      # tested against a non-empty table — the exact condition that broke
      # production. An empty table would pass even with the bug present.
      - name: Seed a row, then re-run the migration guard against it
        run: |
          set -e
          # Actually insert an order, and drop accessToken first, to recreate the
          # exact production state that broke six deploys: a non-empty orders
          # table missing the column. Without a real row this proves nothing —
          # adding a UNIQUE NOT NULL column to an *empty* table always succeeds,
          # so the earlier version of this step passed whether the bug was
          # present or not.
          node -e '
            const { Client } = require("pg");
            (async () => {
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              await c.query(`ALTER TABLE orders DROP COLUMN IF EXISTS "accessToken"`);
              await c.query(`
                INSERT INTO products (id, name, slug, type, price, currency, "isActive", "sortOrder", "createdAt", "updatedAt")
                VALUES ($1, $2, $3, $4::"ProductType", $5, $6, true, 0, NOW(), NOW())
                ON CONFLICT (slug) DO NOTHING
              `, ["ci-prod-1", "CI Product", "ci-product", "TRAINING_PLAN", 10000, "EGP"]);
              await c.query(`
                INSERT INTO orders (id, "productId", "orderRef", amount, currency, "paymentMethod", status,
                                    "isRenewal", "customerName", "customerEmail", "customerPhone",
                                    "createdAt", "updatedAt")
                VALUES ($1, $2, $3, $4, $5, $6::"PaymentMethod", $7::"OrderStatus", false, $8, $9, $10, NOW(), NOW())
                ON CONFLICT ("orderRef") DO NOTHING
              `, ["ci-order-1", "ci-prod-1", "CI-LEGACY-001", 10000, "EGP", "INSTAPAY",
                  "AWAITING_CONFIRMATION", "CI Legacy", "ci-legacy@example.com", "+200000000000"]);
              const { rows } = await c.query("SELECT COUNT(*)::int AS n FROM orders");
              console.log("orders rows before migration:", rows[0].n);
              if (rows[0].n < 1) { console.error("expected at least one seeded order"); process.exit(1); }
              await c.end();
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '
          node scripts/pre-push-migrate.js
          npx prisma db push
          # The seeded row must have come out with a real, unique accessToken.
          node -e '
            const { Client } = require("pg");
            (async () => {
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              const { rows } = await c.query(
                `SELECT "orderRef", "accessToken" FROM orders WHERE "orderRef" = $1`,
                ["CI-LEGACY-001"]
              );
              await c.end();
              if (!rows.length) { console.error("seeded order disappeared"); process.exit(1); }
              const token = rows[0].accessToken;
              if (!token) { console.error("accessToken was not backfilled"); process.exit(1); }
              console.log("backfilled accessToken OK (length " + token.length + ")");
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '

      # Products drive checkout; an empty products table takes the buy button
      # down entirely. Run the guard on a fresh database (creates both), then
      # again (must be a clean no-op), and assert the API contract holds.
      - name: Verify the product guard is correct and idempotent
        run: |
          set -e
          echo "--- first run: should create both products ---"
          node scripts/ensure-products.js
          echo "--- second run: should change nothing ---"
          node scripts/ensure-products.js
          echo "--- assert both slugs exist and are active ---"
          node -e '
            const { Client } = require("pg");
            (async () => {
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              const { rows } = await c.query(
                `SELECT slug FROM products WHERE "isActive" = true ORDER BY slug`
              );
              const slugs = rows.map((r) => r.slug);
              await c.end();
              const want = ["personal-coaching", "training-split"];
              const missing = want.filter((s) => !slugs.includes(s));
              if (missing.length) {
                console.error("Missing active product(s):", missing.join(", "));
                process.exit(1);
              }
              // Both real slugs must be present and active. Not an exact count:
              // the migration step above seeds its own "ci-product" row, and an
              // exact match would fail on that rather than on a real regression.
              console.log("active products OK:", slugs.join(", "));
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '

      - name: Type check
        run: npx tsc --noEmit

      # Reported, not enforced. The repo currently has ~37 pre-existing eslint
      # errors (mostly react-hooks/set-state-in-effect) that predate this
      # workflow; failing on them would block every deploy for reasons unrelated
      # to the change being pushed. Type check and build above are the hard
      # gates. Turn this into a blocking step once the existing errors are
      # cleared.
      - name: Lint (report only)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-script-lint:
    name: Shell-check the deploy script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The deploy script is a heredoc inside YAML, so a syntax error in it is
      # invisible until it runs on the VPS mid-deploy. Extract and parse it here.
      - name: Extract and syntax-check the deploy script
        run: |
          set -e
          python3 - <<'PY'
          import yaml
          with open('.github/workflows/deploy.yml', encoding='utf-8') as f:
              doc = yaml.safe_load(f)
          steps = doc['jobs']['deploy']['steps']
          script = next(s['with']['script'] for s in steps if 'with' in s and 'script' in s['with'])
          with open('/tmp/deploy_script.sh', 'w', encoding='utf-8') as f:
              f.write(script)
          print(f"extracted {len(script.splitlines())} lines")
          PY
          bash -n /tmp/deploy_script.sh
          echo "deploy script syntax OK"

      - name: Syntax-check helper scripts
        run: node --check scripts/pre-push-migrate.js
